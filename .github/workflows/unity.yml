name: Unity

on:
  workflow_call:

permissions:
  contents: read
  checks: write

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2022.3.62f3
          - 6000.0.85f1
          - 6000.6.7f1
    steps:
      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          large-packages: false

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the Unity version of the project
        env:
          UNITY_VERSION: ${{ matrix.unityVersion }}
        run: |
          mkdir -p UnityProject/ProjectSettings UnityProject/Assets
          printf 'm_EditorVersion: %s\n' "$UNITY_VERSION" > UnityProject/ProjectSettings/ProjectVersion.txt

      - name: Restore the Library folder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: UnityProject/Library
          key: Library-tests-${{ matrix.unityVersion }}-${{ hashFiles('UnityPackage/**', 'UnityProject/**') }}
          restore-keys: Library-tests-${{ matrix.unityVersion }}-

      - name: Run EditMode and PlayMode tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          GAME_CI_COVERAGE_ENABLED: false
        with:
          unityVersion: ${{ matrix.unityVersion }}
          cliVersion: v0.1.69
          projectPath: UnityProject
          testMode: all
          githubToken: ${{ github.token }}
          checkName: Test results on ${{ matrix.unityVersion }}

      - name: Check that the package compiles without warnings
        if: always()
        run: |
          warnings=$(grep -hs "warning CS" artifacts/*.log | grep -e "UnityPackage" | sort -u || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::The package compiled with warnings."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.unityVersion }}
          path: artifacts
          retention-days: 7

  builds:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - unityVersion: 2022.3.62f3
            targetPlatform: WebGL
            backend: IL2CPP
            uploadSmoke: true
          - unityVersion: 2022.3.62f3
            targetPlatform: Android
            backend: IL2CPP
            uploadSmoke: false
          - unityVersion: 2022.3.62f3
            targetPlatform: StandaloneLinux64
            backend: IL2CPP
            uploadSmoke: true
          - unityVersion: 2022.3.62f3
            targetPlatform: StandaloneLinux64
            backend: Mono2x
            uploadSmoke: false
          - unityVersion: 2022.3.62f3
            targetPlatform: StandaloneWindows64
            backend: Mono2x
            uploadSmoke: false
          - unityVersion: 6000.0.85f1
            targetPlatform: WebGL
            backend: IL2CPP
            uploadSmoke: false
          - unityVersion: 6000.0.85f1
            targetPlatform: Android
            backend: IL2CPP
            uploadSmoke: false
          - unityVersion: 6000.0.85f1
            targetPlatform: StandaloneLinux64
            backend: IL2CPP
            uploadSmoke: false
          - unityVersion: 6000.6.7f1
            targetPlatform: WebGL
            backend: IL2CPP
            uploadSmoke: true
          - unityVersion: 6000.6.7f1
            targetPlatform: Android
            backend: IL2CPP
            uploadSmoke: false
          - unityVersion: 6000.6.7f1
            targetPlatform: iOS
            backend: IL2CPP
            uploadSmoke: false
          - unityVersion: 6000.6.7f1
            targetPlatform: StandaloneLinux64
            backend: IL2CPP
            uploadSmoke: true
          - unityVersion: 6000.6.7f1
            targetPlatform: StandaloneOSX
            backend: Mono2x
            uploadSmoke: false
          - unityVersion: 6000.6.7f1
            targetPlatform: StandaloneWindows64
            backend: Mono2x
            uploadSmoke: false
    steps:
      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          large-packages: false

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the Unity version of the project
        env:
          UNITY_VERSION: ${{ matrix.unityVersion }}
        run: |
          mkdir -p UnityProject/ProjectSettings UnityProject/Assets
          printf 'm_EditorVersion: %s\n' "$UNITY_VERSION" > UnityProject/ProjectSettings/ProjectVersion.txt

      - name: Add package samples to UnityProject
        run: cp -r UnityPackage/Samples~ UnityProject/Assets/Samples

      - name: Build sample player with High managed stripping
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        with:
          unityVersion: ${{ matrix.unityVersion }}
          targetPlatform: ${{ matrix.targetPlatform }}
          projectPath: UnityProject
          buildMethod: reromanlee.Mocker.ContinuousIntegration.PlayerBuild.Build
          customParameters: -scriptingBackend ${{ matrix.backend }}
          versioning: None

      - name: Upload smoke player artifact
        if: matrix.uploadSmoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.targetPlatform }}-${{ matrix.unityVersion }}
          path: |
            build/${{ matrix.targetPlatform }}
            !build/${{ matrix.targetPlatform }}/*_BackUpThisFolder_*
            !build/${{ matrix.targetPlatform }}/*_BackUpThisFolder_*/**
          retention-days: 1

  run-linux-il2cpp:
    name: Linux IL2CPP smoke
    needs: builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2022.3.62f3
          - 6000.6.7f1
    steps:
      - name: Download built Linux IL2CPP player
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-StandaloneLinux64-${{ matrix.unityVersion }}
          path: player

      - name: Install headless Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri

      - name: Run headless IL2CPP High-stripping smoke test
        run: |
          set -euo pipefail
          exe="$PWD/player/StandaloneLinux64.x86_64"
          log_file="$PWD/player.log"
          test -f "$exe"
          chmod u+x "$exe"
          find "$PWD/player" -maxdepth 1 -type f -name '*.so*' -exec chmod u+x {} +
          echo "Launching $exe"
          status=0
          xvfb-run --auto-servernum --server-args="-screen 0 640x480x24" \
            timeout 120 "$exe" -batchmode -nographics -mocker-smoke-quit -logFile "$log_file" || status=$?
          if [ -f "$log_file" ]; then
            cat "$log_file"
          else
            echo "::warning::player.log was not created."
          fi
          if [ "$status" -ne 0 ]; then
            ldd "$exe" "$PWD/player/UnityPlayer.so" "$PWD/player/GameAssembly.so" || true
            echo "::error::Linux IL2CPP player exited with code $status."
            exit "$status"
          fi
          grep -F "Mocker GettingStarted ready: saves=profile:checkpoint, bus=SFX, volume=0" "$log_file"

  run-webgl:
    name: WebGL smoke
    needs: builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2022.3.62f3
          - 6000.6.7f1
    steps:
      - name: Download built WebGL player
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-WebGL-${{ matrix.unityVersion }}
          path: webgl-build

      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

      - name: Execute WebGL IL2CPP High-stripping player in Chromium
        run: |
          python3 - <<'PY'
          import functools
          import http.server
          import os
          import socketserver
          import threading
          import time
          from playwright.sync_api import sync_playwright

          root = os.path.abspath("webgl-build")
          for dirpath, _, filenames in os.walk(root):
              if "index.html" in filenames:
                  root = dirpath
                  break

          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=root)
          httpd = socketserver.TCPServer(("127.0.0.1", 0), handler)
          port = httpd.server_address[1]
          thread = threading.Thread(target=httpd.serve_forever, daemon=True)
          thread.start()

          expected = "Mocker GettingStarted ready: saves=profile:checkpoint, bus=SFX, volume=0"
          logs = []
          errors = []

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True, args=["--use-gl=angle", "--use-angle=swiftshader", "--enable-unsafe-swiftshader"])
                  page = browser.new_page()
                  page.on("console", lambda msg: logs.append(msg.text))
                  page.on("pageerror", lambda err: errors.append(str(err)))
                  page.goto(f"http://127.0.0.1:{port}/index.html", wait_until="domcontentloaded")
                  deadline = time.monotonic() + 90.0
                  while time.monotonic() < deadline and not any(expected in line for line in logs) and not errors:
                      page.wait_for_timeout(500)
                  browser.close()
          finally:
              httpd.shutdown()

          print("\n".join(logs))
          assert not errors, f"WebGL page errors: {errors}"
          assert any(expected in line for line in logs), f"Expected log line not observed: {expected}"
          PY
