name: DotNet

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.jpg'
      - '**.png'
      - '**.svg'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.jpg'
      - '**.png'
      - '**.svg'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build DotNet/Mocker.slnx --configuration Release

      - name: Verify committed generator DLL matches source
        shell: bash
        run: |
          dotnet build DotNet/Mocker.slnx --configuration Release -p:UpdateUnityPackage=true
          git diff --exit-code --stat -- UnityPackage/Runtime/Plugins

      - name: Test
        run: dotnet test DotNet/Mocker.slnx --configuration Release --no-build --logger trx --logger "console;verbosity=normal" --results-directory TestResults

      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7
